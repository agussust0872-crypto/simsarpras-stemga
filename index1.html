    <script>
        // Global State & Data Store
        window.currentUserRole = 'admin';
        window.currentView = 'dashboard';
        window.activeScannedItem = null;

        // Firestore Real-time Storage Integration
        let db = null;
        let auth = null;
        let isOnlineSyncActive = false;

        window.initOnlineCloudSync = async function() {
            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'simsarpras-stemga';
                if (typeof __firebase_config === 'undefined') return;
                const firebaseConfig = JSON.parse(__firebase_config);

                const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
                const { getAuth, signInAnonymously, signInWithCustomToken } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                const { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                if (!auth.currentUser) return;

                // Bind Real-Time Cloud Listeners
                window.listenToPublicCollection('inventoryTanah', (data) => { window.inventoryTanah = data; window.renderTanahTable(); });
                window.listenToPublicCollection('inventoryRuang', (data) => { window.inventoryRuang = data; window.renderRuangTable(); });
                window.listenToPublicCollection('inventory', (data) => { window.inventory = data; window.renderInventarisTable(); window.renderDashboard(); });
                window.listenToPublicCollection('reports', (data) => { window.reports = data; window.renderVerifikasiTable(); window.renderDashboard(); window.updateLaporanAnalytics(); });
                window.listenToPublicCollection('workOrders', (data) => { window.workOrders = data; window.renderWorkOrders(); window.renderTeknisiPanel(); window.renderDashboard(); });
                window.listenToPublicCollection('repairs', (data) => { window.repairs = data; window.renderDashboard(); window.updateLaporanAnalytics(); });
                window.listenToPublicCollection('schedules', (data) => { window.schedules = data; window.renderMaintenanceTable(); });
                window.listenToPublicCollection('buildingInspections', (data) => { window.buildingInspections = data; window.renderBuildingInspections(); });

                isOnlineSyncActive = true;
                const badge = document.getElementById('syncStatusBadge');
                if (badge) badge.classList.remove('hidden');
            } catch (e) {
                console.warn("Online Cloud Sync disabled or running offline:", e);
            }
        };

        window.listenToPublicCollection = async function(collectionName, callback) {
            if (!db || !auth.currentUser) return;
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'simsarpras-stemga';
            const { collection, onSnapshot } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', collectionName);
            onSnapshot(colRef, (snapshot) => {
                const items = [];
                snapshot.forEach(docSnap => {
                    items.push(docSnap.data());
                });
                callback(items);
            }, (err) => {
                console.warn(`Realtime snapshot listener error on ${collectionName}:`, err);
            });
        };

        window.syncSaveToCloud = async function(collectionName, item) {
            if (!db || !auth || !auth.currentUser) return;
            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'simsarpras-stemga';
                const docId = String(item.id || item.woNumber || item.reportId || item.woNumber || crypto.randomUUID());
                const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', collectionName, docId);
                await setDoc(docRef, item, { merge: true });
            } catch (e) {
                console.warn(`Failed to sync item to ${collectionName}:`, e);
            }
        };

        window.syncDeleteFromCloud = async function(collectionName, itemId) {
            if (!db || !auth || !auth.currentUser) return;
            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'simsarpras-stemga';
                const { doc, deleteDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', collectionName, String(itemId));
                await deleteDoc(docRef);
            } catch (e) {
                console.warn(`Failed to delete item from ${collectionName}:`, e);
            }
        };
